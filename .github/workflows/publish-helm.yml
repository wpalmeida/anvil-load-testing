name: Publish Helm chart

# Packages the chart and pushes it to GHCR as an OCI artifact. Triggered by
# semver git tags (the same ones that publish container images).
#
# Users install with:
#   helm install anvil oci://ghcr.io/<owner>/charts/anvil --version 0.1.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::not a semver: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Stamp Chart.yaml with the release version
        run: |
          v="${{ steps.ver.outputs.version }}"
          sed -i -E "s/^version: .*/version: ${v}/" deploy/helm/anvil/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${v}\"/" deploy/helm/anvil/Chart.yaml
          echo "--- Chart.yaml after stamp ---"
          head -5 deploy/helm/anvil/Chart.yaml

      - name: Mirror dashboard into chart
        run: ./infra/sync-dashboard.sh

      - name: Lint chart
        run: helm lint deploy/helm/anvil

      - name: Render chart (smoke)
        run: helm template anvil deploy/helm/anvil > /dev/null

      - name: Package chart
        run: helm package deploy/helm/anvil -d /tmp

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI registry
        run: |
          v="${{ steps.ver.outputs.version }}"
          owner="${{ steps.ver.outputs.owner }}"
          helm push "/tmp/anvil-${v}.tgz" "oci://ghcr.io/${owner}/charts"

      - name: Step summary
        run: |
          v="${{ steps.ver.outputs.version }}"
          owner="${{ steps.ver.outputs.owner }}"
          {
            echo "## Chart published"
            echo ""
            echo "**Version**: \`${v}\`"
            echo "**OCI ref**: \`oci://ghcr.io/${owner}/charts/anvil\`"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "helm install anvil oci://ghcr.io/${owner}/charts/anvil --version ${v} \\"
            echo "  --set image.api.tag=${v} \\"
            echo "  --set image.worker.tag=${v} \\"
            echo "  --set image.web.tag=${v}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
