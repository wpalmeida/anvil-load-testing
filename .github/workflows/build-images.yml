name: Build & push images

# Builds all four service images (api, worker, web, sample target) and pushes
# them to GitHub Container Registry. PRs trigger a build-only validation step
# without pushing — catches Dockerfile breakage before merge.
#
# Tag strategy (handled by docker/metadata-action):
#   - push to main          → :latest, :main, :sha-<short>
#   - git tag v1.2.3        → :1.2.3, :1.2, :latest, :sha-<short>
#   - PR                    → builds locally, does NOT push
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./api
            image: anvil-api
          - app: worker
            context: ./worker
            image: anvil-worker
          - app: web
            context: ./web
            image: anvil-web
          - app: target-api
            context: ./samples/target-api
            image: anvil-sample-target

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build${{ github.event_name == 'pull_request' && '' || ' & push' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          # amd64 only for now. QEMU's user-mode emulation crashes Node.js
          # randomly during `npm install` (`qemu: uncaught target signal 4`),
          # so cross-arch builds via emulation are unreliable. To add arm64,
          # split the matrix to use native arm64 runners (`ubuntu-24.04-arm`,
          # free for public repos) and merge per-arch images into a manifest.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
