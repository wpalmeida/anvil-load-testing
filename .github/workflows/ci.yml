name: CI

# Lint + typecheck on every PR. Doesn't run tests yet (the project has none),
# but catches type errors and broken Helm templates before they merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          if jq -e '.scripts.typecheck' package.json > /dev/null; then
            npm run typecheck
          else
            npx --no-install tsc -b --noEmit || npx tsc -b --noEmit
          fi

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: helm lint deploy/helm/anvil

      - name: Render chart (smoke test)
        run: helm template anvil deploy/helm/anvil > /tmp/rendered.yaml && wc -l /tmp/rendered.yaml

  dashboard-sync:
    # Catch the case where someone edits infra/grafana-dashboard.json but
    # forgets to run sync-dashboard.sh — the chart copy would be stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        run: ./infra/sync-dashboard.sh

      - name: Verify nothing changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Dashboard files are out of sync. Run ./infra/sync-dashboard.sh and commit the result."
            git diff --stat
            exit 1
          fi
