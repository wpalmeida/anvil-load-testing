# Default values for Anvil.
# Override anything you want with `helm install -f my-values.yaml`.

# -----------------------------------------------------------------------------
# Container images
#
# You must publish the api/worker/web images to a registry before installing —
# see deploy/helm/anvil/README.md for a quick `docker buildx bake` recipe.
# -----------------------------------------------------------------------------
image:
  pullPolicy: IfNotPresent
  pullSecrets: []
  api:
    repository: ghcr.io/wpalmeida/anvil-api
    tag: ""               # falls back to .Chart.AppVersion
  worker:
    repository: ghcr.io/wpalmeida/anvil-worker
    tag: ""
  web:
    repository: ghcr.io/wpalmeida/anvil-web
    tag: ""

# -----------------------------------------------------------------------------
# App services
# -----------------------------------------------------------------------------
api:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4000
  resources: {}
  podAnnotations: {}
  # Pod scheduling — all empty by default; populate to constrain placement.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior: {}
  pdb:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""
  # Safety guards — empty/0 means "no limit".
  guards:
    targetHostAllowlist: ""        # comma-separated, supports *.suffix
    maxVus: 1000
    maxDurationSeconds: 3600
    maxConcurrentRuns: 5

worker:
  replicaCount: 1
  resources: {}
  concurrency: 2
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""

  # HorizontalPodAutoscaler — scales worker pods on resource utilization.
  # When enabled, replicaCount is ignored (HPA takes over). For queue-depth
  # scaling (more accurate for this workload) install KEDA and replace this
  # with a ScaledObject; left to the operator.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Optional v2 scaling behavior (windows, policies). Leave empty for
    # k8s defaults. Example:
    #   behavior:
    #     scaleDown:
    #       stabilizationWindowSeconds: 300
    behavior: {}

  # PodDisruptionBudget — keeps at least N workers available during
  # voluntary disruptions (node drains, upgrades) so in-flight runs don't
  # all die at once.
  pdb:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""  # alternative to minAvailable

web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  # nginx is cheap; CPU is rarely the bottleneck so the target stays a
  # touch higher than api's.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}
  pdb:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: anvil.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # In-cluster URL nginx proxies /api/* to. Defaults to the bundled API
  # service. Override if the API runs outside the namespace or has a custom
  # name. The browser never sees this — it only ever talks to the web pod.
  apiUpstream: ""

# -----------------------------------------------------------------------------
# Backing services
#
# Each block has the same shape:
#   <svc>.enabled         – deploys a bundled instance into the namespace
#   <svc>.external.<...>  – consumed when enabled=false; point at your own
#
# For production you almost certainly want enabled=false for the data layer
# and external.url pointing at a managed service.
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    user: postgres
    password: postgres
    database: loadtest
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  # When enabled=false, set this to a full URL:
  external:
    url: ""                # e.g. postgresql://user:pass@pg.internal:5432/loadtest

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  external:
    url: ""                # e.g. redis://redis.internal:6379

influxdb:
  enabled: true
  image:
    repository: influxdb
    tag: "1.8-alpine"
  database: k6
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  external:
    url: ""                # e.g. http://influx.internal:8086/k6

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.1.0"
  admin:
    user: admin
    password: admin
  service:
    type: ClusterIP
    port: 3000
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: grafana.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # Public URL the BROWSER uses when clicking "Open in Grafana" on a run.
  # MUST be reachable from the user's machine — leaving this empty in k8s
  # means the deep-link button is hidden until you provide a real URL.
  #
  # If you also enable grafana.ingress.enabled below, this is auto-derived
  # from ingress.hosts[0] (https when tls is configured), so you usually
  # don't need to set it explicitly.
  baseUrl: ""
  dashboardUid: anvil
  external:
    baseUrl: ""            # e.g. https://grafana.your-org.com — bypasses the bundled service entirely
